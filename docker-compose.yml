services:
  db:
    image: postgres:15-alpine
    container_name: mission_control_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mission_control_network

  redis:
    image: redis:7-alpine
    container_name: mission_control_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mission_control_network

  web:
    build: .
    container_name: mission_control_web
    restart: unless-stopped
    command: ["gunicorn", "-c", "gunicorn.conf.py", "config.wsgi:application"]
    volumes:
      - .:/app
      - static_data:/app/staticfiles
      - media_data:/app/mediafiles
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      DEBUG: ${DEBUG:-False}
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; request = urllib.request.Request('http://localhost:8000/api/health/', headers={'Host': '${HEALTHCHECK_HOST:-localhost}', 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request)\" || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mission_control_network

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    image: mission-control-nginx
    container_name: mission_control_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - media_data:/app/mediafiles:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --header='Host: ${HEALTHCHECK_HOST:-localhost}' --header='X-Forwarded-Proto: https' http://127.0.0.1:80/api/health/ || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mission_control_network

  celery:
    build: .
    container_name: mission_control_celery
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    volumes:
      - .:/app
      - static_data:/app/staticfiles
      - media_data:/app/mediafiles
    env_file:
      - .env
    environment:
      DEBUG: ${DEBUG:-False}
      RUN_MIGRATIONS: "False"
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mission_control_network
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 10 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mission_control_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - mission_control_network

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  static_data:
  media_data:

networks:
  mission_control_network:
    driver: bridge
