limit_req_zone $binary_remote_addr zone=app_rate_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_rate_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=per_ip_conn_limit:10m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    reset_timedout_connection on;
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $django_upstream http://web:8000;

    # -- Gzip compression -------------------------------------------------
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;

    client_max_body_size 60m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;
    large_client_header_buffers 2 8k;
    client_body_buffer_size 16k;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # -- Static files (served directly by Nginx, bypass Gunicorn) ---------
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # -- Health check (no rate limiting — used by Docker healthcheck) -----
    location = /api/health/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass $django_upstream;
    }

    location ~ ^/api/accounts/(activate/|users/password-reset/|users/password-reset-confirm/) {
        limit_req zone=auth_rate_limit burst=5 nodelay;
        limit_conn per_ip_conn_limit 5;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_pass $django_upstream;
    }

    location /internal-media/ {
    internal;
    alias /app/mediafiles/;
    }

    location / {
        limit_req zone=app_rate_limit burst=20 nodelay;
        limit_conn per_ip_conn_limit 20;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_pass $django_upstream;
    }
}
