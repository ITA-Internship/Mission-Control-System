name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files

  unit-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: "dummy-secret-key-for-github-actions"
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install system dependencies
        # libmagic is loaded via ctypes when `magic` is imported (media uploads
        # are content-validated with it). Declare it explicitly rather than
        # relying on it being pre-installed on the runner image.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmagic1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          python manage.py test


  build-verify:
    name: Build Verification
    needs: [linting, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: django-app:ci-test

  deploy:
    name: Deploy to target Environment
    needs: build-verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Environment Validation Check
          run: |
            echo "Checking environment requirements before deployment..."
            # If the server doesn't exist yet, we simply check for the presence of the secret for SSH.
            if [ -z "${{ secrets.PROD_SSH_KEY }}" ]; then
              echo "Warning: PROD_SSH_KEY secret is not set. Real deployment is skipped."
            fi

        - name: Deployment Foundation
          run: |
            echo "Executing deployment steps for the target environment..."
            echo "Example script:"
            echo "ssh user@production-server 'cd /var/www/app && \
              git pull origin main && \
              bash deploy/scripts/check_env.sh && \
              docker-compose up -d --build'"
