      - user
    Mission:
      type: object
      description: |-
        Serialize a mission, including its nested drone assignments.

        Handles both create and update. Assignments may only be set at creation
        time; on update the nested ``drones`` field is forced read-only (see
        ``__init__``) so they are managed through the dedicated assignment endpoints
        instead.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        commander:
          allOf:
          - $ref: '#/components/schemas/UserBrief'
          readOnly: true
        commander_id:
          type: integer
          writeOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/MissionStatus'
          readOnly: true
        result:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/MissionResult'
          - $ref: '#/components/schemas/NullEnum'
        location_description:
          type: string
          nullable: true
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          maxLength: 5000
        incident_notes:
          type: string
          maxLength: 5000
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBrief'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        drones:
          type: array
          items:
            $ref: '#/components/schemas/MissionDroneInput'
      required:
      - commander
      - created_at
      - created_by
      - id
      - result
      - status
      - title
      - updated_at
    MissionArtifact:
