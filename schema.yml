    DroneSpecUpdate:
      type: object
      description: Serialize partial updates to a drone technical specification.
      properties:
        id:
          type: integer
          readOnly: true
        frame_type:
          type: string
          maxLength: 255
        motor_model:
          type: string
          maxLength: 255
        battery_type:
          type: string
          maxLength: 255
        battery_capacity_mah:
          type: integer
          maximum: 2147483647
          minimum: 0
        battery_model:
          type: string
          maxLength: 255
        camera_model:
          type: string
          maxLength: 255
        camera_specs: {}
        vtx_model:
          type: string
          maxLength: 255
        flight_controller:
          type: string
          maxLength: 255
        firmware_version:
          type: string
          maxLength: 255
        is_firmware_outdated:
          type: boolean
          description: Indicates if the firmware or communication parameters are unsupported.
        communication_protocol:
          type: string
          maxLength: 100
        control_channel:
          type: string
          maxLength: 255
        telemetry_channel:
          type: string
          maxLength: 255
        max_speed_kmh:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        typical_range_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
        max_range_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        typical_flight_time_min:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
        max_flight_time_min:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        frequency_mhz:
          type: integer
          maximum: 2147483647
          minimum: 0
        payload_capacity_g:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        additional_modules: {}
        technical_documentation_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        firmware_file_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - updated_at
    DroneStatus:
      enum:
      - ACTIVE
      - IN_MISSION
      - DAMAGED
      - LOST
      - MAINTENANCE
      - DECOMMISSIONED
      - SOLD
      - TRANSFERRED
      - WRITTEN_OFF
      type: string
    DroneStatusHistory:
      type: object
      description: |-
        Serialize drone lifecycle status history with display metadata.

        Adds a readable user label and event type so clients can distinguish status
        changes caused by missions, repairs, write-offs, or manual updates.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        from_status:
          type: string
          readOnly: true
        to_status:
          type: string
          readOnly: true
        changed_by:
          type: integer
          readOnly: true
          nullable: true
        changed_by_display:
          type: string
          description: Return a readable name for the user who changed the status.
          readOnly: true
        reason:
          type: string
          readOnly: true
        event_type:
          type: string
          description: Return the domain event type that caused this status history
            entry.
          readOnly: true
        related_mission_id:
          type: integer
          readOnly: true
        related_repair_order:
          type: integer
          readOnly: true
          nullable: true
        related_writeoff:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - changed_by
      - changed_by_display
      - created_at
      - event_type
      - from_status
      - id
      - reason
      - related_mission_id
      - related_repair_order
      - related_writeoff
      - to_status
