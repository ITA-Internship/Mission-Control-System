            examples:
              ValidRequest:
                value:
                  status: IN_PROGRESS
                  notes: Technician started the repair.
                summary: Valid Request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRepairOrderStatusUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRepairOrderStatusUpdate'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairOrder'
              examples:
                ValidRequest:
                  value:
                    id: 2
                    drone: 21
                    defect_report: 4
                    status: IN_PROGRESS
                    description: Replace damaged camera gimbal and recalibrate.
                    assigned_to: 31
                    started_at: '2026-07-03T05:30:00Z'
                    completed_at: null
                    notes: Awaiting replacement gimbal from stores.
                    created_by: 24
                    created_at: '2026-07-03T05:15:02.114120Z'
                    updated_at: '2026-07-03T05:30:00.552310Z'
                  summary: Valid Request
          description: Repair order status updated successfully.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                DisallowedTransition:
                  value:
                    status:
                    - 'Cannot transition from PENDING to COMPLETED. Allowed: [''IN_PROGRESS'',
                      ''CANCELLED'']'
                  summary: Disallowed transition
          description: Bad Request
        '403':
          description: Forbidden. User does not have permission to perform this action.
        '404':
          description: Not Found.
  /api/repairs/orders/{id}/replacements/:
    post:
      operationId: repairs_orders_replacements_create
      description: "Records a new component replacement and links it to an existing
        repair order.\n\nValidation: \n- A new serial number is required. \n- A reason
        is required. \n- `replaced_at` cannot be in the future. \n- If the component
        type is `OTHER`, a component name must be provided; for known component types
        any supplied name is cleared.\n\nRequired permission: `PERMISSION_REPAIRS_MANAGE`."
      summary: Add a component replacement to a repair order
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID of the repair order the replacement is attached to.
        required: true
      tags:
      - repairs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepairOrderReplacement'
            examples:
              ValidRequest:
                value:
                  component_type: CAMERA
                  component_name: null
                  old_serial_number: CAM-GIMBAL-OLD
                  new_serial_number: CAM-GIMBAL-NEW
                  reason: Gimbal replaced after confirmed camera feed instability.
                  replaced_at: '2026-07-03'
                summary: Valid Request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RepairOrderReplacement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RepairOrderReplacement'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairOrderReplacement'
              examples:
                ValidRequest:
                  value:
                    id: 6
                    component_type: CAMERA
                    component_name: null
                    old_serial_number: CAM-GIMBAL-OLD
                    new_serial_number: CAM-GIMBAL-NEW
                    reason: Gimbal replaced after confirmed camera feed instability.
                    replaced_at: '2026-07-03T00:00:00Z'
                    replaced_by: 24
                    created_at: '2026-07-03T05:40:12.114120Z'
                    updated_at: '2026-07-03T05:40:12.114160Z'
                  summary: Valid Request
          description: Component replacement recorded and linked successfully.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                NameRequiredForOTHER:
                  value:
                    component_name:
                    - Component name is required for OTHER.
                  summary: Name required for OTHER
                MissingNewSerialNumber:
                  value:
                    new_serial_number:
                    - New serial number is required.
                  summary: Missing new serial number
          description: Bad Request
        '403':
          description: Forbidden. User does not have permission to perform this action.
        '404':
          description: Not Found.
  /api/repairs/replacements/:
    get:
      operationId: repairs_replacements_list
      description: |-
        Retrieves a paginated and filtered list of all recorded component replacements performed on drones.

        Required permission: `PERMISSION_REPAIRS_VIEW`.
      summary: List component replacements
      parameters:
      - in: query
        name: component_type
        schema:
          type: string
          enum:
          - BATTERY
          - CAMERA
          - FIRMWARE
          - FLIGHT_CONTROLLER
          - FRAME
          - MOTOR
          - OTHER
          - PROPELLER
          - VTX
          - WIRING
      - in: query
        name: drone
        schema:
          type: integer
      - in: query
        name: end_date
        schema:
          type: string
          format: date-time
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: replaced_by
        schema:
          type: integer
      - in: query
        name: start_date
        schema:
          type: string
          format: date-time
      tags:
      - repairs
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedComponentReplacementListList'
              examples:
                ValidRequest:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - id: 1
                      drone: 24
                      component_type: MOTOR
                      component_name: null
                      new_serial_number: TM-F60PV-24004-B
                      replaced_at: '2026-05-09T09:30:00Z'
                      replaced_by: 31
                      created_at: '2026-07-02T02:21:31.258041Z'
                  summary: Valid Request
          description: Successfully retrieved the list of component replacements.
        '403':
          description: Forbidden. User does not have permission to perform this action.
    post:
      operationId: repairs_replacements_create
      description: "Creates a new component replacement report. \n\nValidation: \n-
        If component type is `OTHER`, component name must be provided.\n\nRequired
        permission: `PERMISSION_REPAIRS_CREATE`."
      summary: Record a component replacement
      tags:
      - repairs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComponentReplacement'
