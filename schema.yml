openapi: 3.0.3
info:
  title: Mission Control System API
  version: 0.0.0
  description: Documentation for Mission-Control-System
paths:
  /api/accounts/activate/{user_id}/{token}/:
    post:
      operationId: accounts_activate_create
      description: |-
        Validates the activation token provided via the URL parameters. If the token is valid and the account is still pending activation, it validates the submitted password against the password-strength policy, sets it as the user's password, activates the account, and creates an audit log entry.

        Required permission: `AllowAny`.
      summary: Activate user account
      parameters:
      - in: path
        name: token
        schema:
          type: string
        description: The one-time activation token generated for the user.
        required: true
      - in: path
        name: user_id
        schema:
          type: integer
        description: ID of the user activating the account.
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountActivation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountActivation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountActivation'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: Your account has been activated. You can now log in.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ActivationLinkError:
                  value:
                    detail: Invalid or expired activation link.
                  summary: Activation link error
                AccountAlreadyActivated:
                  value:
                    detail: This account has already been activated.
                  summary: Account already activated
                MissingRequiredField:
                  value:
                    password:
                    - This field is required.
                  summary: Missing required field
                PasswordTooWeak:
                  value:
                    password:
                    - This password is too short. It must contain at least 8 characters.
                  summary: Password too weak
          description: Bad Request
        '404':
          description: Not Found.
  /api/accounts/audit-log/:
    get:
      operationId: accounts_audit_log_list
      description: |-
        Retrieves a paginated and filtered list of audit logs. Depending on permissions, users can view all logs or only logs where they are the actor or the target.

        Required permission: `PERMISSION_AUDIT_LOGS_VIEW_OWN, PERMISSION_AUDIT_LOGS_VIEW_ALL`.
      summary: List audit logs
      parameters:
      - in: query
        name: action_type
        schema:
          type: string
          enum:
          - ACCOUNT_ACTIVATED
          - ACCOUNT_DEACTIVATED
          - LOGIN_FAILED
          - LOGIN_SUCCESS
          - LOGOUT
          - PASSWORD_CHANGED
          - PASSWORD_RESET_REQUESTED
          - PERMISSION_DENIED
          - PROFILE_UPDATED
          - ROLE_CHANGED
          - USER_CREATED
      - in: query
        name: actor
        schema:
          type: integer
      - in: query
        name: end_date
        schema:
          type: string
          format: date
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: result
        schema:
          type: string
          enum:
          - FAILED
          - SUCCESS
      - in: query
        name: start_date
        schema:
          type: string
          format: date
      - in: query
        name: target_user
        schema:
          type: integer
      tags:
      - accounts
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
              examples:
                ValidRequest:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - id: 3
                      actor: 1
                      actor_username: user
                      target_user: 1
                      target_user_username: user
                      action_type: LOGOUT
                      result: SUCCESS
                      description: User logged out successfully
                      ip_address: 127.0.0.1
                      user_agent: Test Agent Value
                      created_at: '2026-06-25T14:44:49.068836Z'
                  summary: Valid Request
          description: Successfully retrieved the list of audit logs.
        '403':
          description: Forbidden. User does not have permission to perform this action.
  /api/accounts/audit-log/{id}/:
    get:
      operationId: accounts_audit_log_retrieve
      description: |-
        Retrieves detailed information about specific audit log entry by its ID. Depending on permissions, users can view all logs or only logs where they are the actor or the target.

        Required permission: `PERMISSION_AUDIT_LOGS_VIEW_OWN, PERMISSION_AUDIT_LOGS_VIEW_ALL`.
      summary: Retrieve an audit log
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID of specific audit log.
        required: true
      tags:
      - accounts
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
              examples:
                ValidRequest:
                  value:
                    id: 3
                    actor: 1
                    actor_username: user
                    target_user: 1
                    target_user_username: user
                    action_type: LOGOUT
                    result: SUCCESS
                    description: User logged out successfully
                    ip_address: 127.0.0.1
                    user_agent: Test Agent Value
                    created_at: '2026-06-25T14:44:49.068836Z'
                  summary: Valid Request
          description: Audit log details successfully retrieved.
        '403':
          description: Forbidden. User does not have permission to perform this action.
        '404':
          description: Not Found.
  /api/accounts/audit-log/export/:
    get:
      operationId: accounts_audit_log_export_retrieve
      description: "Generates and downloads a CSV file with the filtered audit logs.
        Supports full filtering and sorting identical to the standard list endpoint.
        \n\nThe export is limited to a maximum of 10000 records.\n\nRequired permission:
        `PERMISSION_AUDIT_LOGS_VIEW_OWN, PERMISSION_AUDIT_LOGS_VIEW_ALL`."
      summary: Export audit logs to CSV
      tags:
      - accounts
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: A CSV file containing audit logs generated successfully.
        '403':
          description: Forbidden. User does not have permission to perform this action.
        '429':
          description: Export rate limit exceeded.
  /api/accounts/users/:
    post:
      operationId: accounts_users_create
      description: "Creates a new user. Sends an activation email to the user and
        creates an audit log entry. \n\nValidation: \n- Image file size cannot exceed
        5 MB. \n- Supported image file formats: .jpg, .jpeg, .png, .webp.\n\nRequired
        permission: `PERMISSION_USERS_CREATE`."
      summary: Register a new user
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
            examples:
              ValidRequest:
                value:
                  username: oleksandr.koval
                  email: oleksandr.koval@example.com
                  first_name: Oleksandr
                  last_name: Koval
                  rank: Colonel
                  contact: '+380000000000'
                  role: 1
                  unit: 7
                summary: Valid request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistration'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistration'
              examples:
                ValidRequest:
                  value:
                    username: oleksandr.koval
                    email: oleksandr.koval@example.com
                    first_name: Oleksandr
                    last_name: Koval
                    rank: Colonel
                    contact: '+380000000000'
                    role: 1
                    unit: 7
                  summary: Valid request
          description: User account successfully created.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistration'
              examples:
                InvalidProfilePictureFileExtension:
                  value:
                    profile_picture: 'Unsupported file format. Allowed are: .jpg,
                      .jpeg, .png, .webp.'
                  summary: Invalid profile picture file extension
                InvalidProfilePictureFileSize:
                  value:
                    profile_picture: Image size cannot exceed 5MB.
                  summary: Invalid profile picture file size
          description: Bad Request
        '403':
          description: Forbidden. User does not have permission to perform this action.
  /api/accounts/users/{id}/status/:
    patch:
      operationId: accounts_users_status_partial_update
      description: "Allows system administrators to activate or deactivate a user's
        account, creates an audit log entry. \n\nValidation: \n- User cannot deactivate
        their own account.\n\nRequired permission: `PERMISSION_USERS_ACTIVATE_DEACTIVATE`."
      summary: Update user status
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: pk
        schema:
          type: integer
        description: The ID of the target user whose status is being updated.
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserStatusUpdate'
            examples:
              ValidRequest:
                value:
                  is_active: true
                summary: Valid request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserStatusUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserStatusUpdate'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: User status updated successfully.
        '400':
          description: Bad Request
        '403':
          description: Forbidden. User does not have permission to perform this action.
        '404':
          description: Not Found.
  /api/accounts/users/{user_id}/profile-picture/:
    get:
      operationId: accounts_users_profile_picture_retrieve
      description: "Returns the profile picture image file of the specified user,
        served inline. In production the file is delivered through a protected `X-Accel-Redirect`
        internal redirect; in debug mode the file is streamed directly.\n\nAccess
        rules: \n- Users need `PERMISSION_PROFILE_VIEW_OWN` to retrieve their own
        profile picture. \n- Retrieving another user's profile picture also requires
        `PERMISSION_PROFILE_VIEW_ANY`. \n- Returns 404 if the target user has no profile
        picture, or if the stored file is missing from the server.\n\nRequired permission:
        `PERMISSION_PROFILE_VIEW_OWN`."
      summary: Retrieve a user's profile picture
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        description: ID of the user whose profile picture is being retrieved.
        required: true
      tags:
      - accounts
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: The profile picture image file is returned inline with the
            appropriate content type.
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /api/accounts/users/{user_id}/role/:
    patch:
      operationId: accounts_users_role_partial_update
      description: "Updates the role of a specific user and creates an audit log entry.
        \n\nValidation: \n- The role of an inactive user cannot be changed. \n- Admin
        user cannot remove their own admin role. \n- The admin role cannot be removed
        from the root account. \n- The admin role cannot be removed from the last
        admin user.\n\nRequired permission: `PERMISSION_USERS_MANAGE_ROLES`."
      summary: Update user role
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        description: ID of the user whose role is being updated.
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRoleUpdate'
            examples:
              ValidRequest:
                value:
                  role_id: 3
                summary: Valid request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRoleUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRoleUpdate'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoleUpdateResponse'
              examples:
                ValidRequest:
                  value:
                    role_id: 3
                  summary: Valid request
          description: User role successfully updated.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoleUpdateResponse'
              examples:
                MissingRequiredField:
                  value:
                    role_id: This field is required.
                  summary: Missing required field
                InvalidFieldValue:
                  value:
                    role_id: Invalid role_id
                  summary: Invalid field value
                ChangingRoleOfAnInactiveUser:
                  value:
                    role_id: Cannot change the role of an inactive user.
                  summary: Changing role of an inactive user
          description: Bad Request
        '403':
          description: Forbidden. User does not have permission to perform this action.
        '404':
          description: Not Found.
  /api/accounts/users/me/:
    get:
      operationId: accounts_users_me_retrieve
      description: |-
        Retrieves the profile details of the currently authenticated user.

        Required permission: `PERMISSION_PROFILE_VIEW_OWN`.
      summary: Retrieve current user profile
      tags:
      - accounts
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
              examples:
                ValidRequest:
                  value:
                    id: 24
                    username: oleksander.koval
                    email: oleksander.koval@example.com
                    first_name: Oleksandr
                    last_name: Koval
                    rank: Colonel
                    contact: '+380000000000'
                    profile_picture: null
                    role: 1
                    unit: 7
                    is_active: true
                  summary: Valid Request
          description: Profile details successfully retrieved.
        '403':
          description: Forbidden. User does not have permission to perform this action.
    put:
      operationId: accounts_users_me_update
      description: "Updates the currently authenticated user's profile information
        and creates an audit log entry.\n\nValidation: \n- Image file size cannot
        exceed 5 MB. \n- Supported image file formats: .jpg, .jpeg, .png, .webp.\n\nRequired
        permission: `PERMISSION_PROFILE_UPDATE_OWN`."
      summary: Update current user profile
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserMe'
            examples:
              ValidRequest:
                value:
                  first_name: Oleksandr
                  last_name: Koval
                  rank: Colonel
                  contact: '+380000000000'
                summary: Valid Request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserMe'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserMe'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
              examples:
                ValidRequest:
                  value:
                    id: 24
                    username: oleksander.koval
                    email: oleksander.koval@example.com
                    first_name: Oleksandr
                    last_name: Koval
                    rank: Colonel
                    contact: '+380000000000'
                    profile_picture: null
                    role: 1
                    unit: 7
                    is_active: true
                  summary: Valid Request
          description: Profile information successfully updated.
        '400':
          description: Bad Request. Provided payload contains validation errors.
        '403':
          description: Forbidden. User does not have permission to perform this action.
    patch:
      operationId: accounts_users_me_partial_update
      description: "Updates the currently authenticated user's profile information
        and creates an audit log entry.\n\nValidation: \n- Image file size cannot
        exceed 5 MB. \n- Supported image file formats: .jpg, .jpeg, .png, .webp.\n\nRequired
        permission: `PERMISSION_PROFILE_UPDATE_OWN`."
      summary: Update current user profile
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserMe'
            examples:
              ValidRequest:
                value:
                  first_name: Oleksandr
                  last_name: Koval
                  rank: Colonel
                  contact: '+380000000000'
                summary: Valid Request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserMe'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserMe'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
              examples:
                ValidRequest:
                  value:
                    id: 24
                    username: oleksander.koval
                    email: oleksander.koval@example.com
                    first_name: Oleksandr
                    last_name: Koval
                    rank: Colonel
                    contact: '+380000000000'
                    profile_picture: null
                    role: 1
                    unit: 7
                    is_active: true
                  summary: Valid Request
          description: Profile information successfully updated.
        '400':
          description: Bad Request. Provided payload contains validation errors.
        '403':
          description: Forbidden. User does not have permission to perform this action.
  /api/accounts/users/me/change-password/:
    post:
      operationId: accounts_users_me_change_password_create
      description: |-
        Changes the password for the currently authenticated user and creates an audit log entry. Upon a successful password change, all active sessions for this user are invalidated.

        Required permission: `PERMISSION_PROFILE_RESET_PASSWORD_OWN`.
      summary: Change user password
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
            examples:
              ValidRequest:
                value:
                  old_password: my_old_password_123
                  new_password: my_new_password_123
                summary: Valid Request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: Password changed successfully. Active sessions have been invalidated.
        '400':
          description: Bad Request. Provided payload contains validation errors.
        '403':
          description: Forbidden. User does not have permission to perform this action.
  /api/accounts/users/password-reset/:
    post:
      operationId: accounts_users_password_reset_create
      description: |-
        Accepts a user's email address and sends a password reset link containing a one-time token to that email. An audit log entry and an email are only generated if a matching user is found.

        Required permission: `AllowAny`.
      summary: Initiate password reset
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequest'
          description: If an account with this email exists, a password reset link
            has been sent.
        '400':
          description: Bad Request. Provided payload contains validation errors.
  /api/accounts/users/password-reset-confirm/{uidb64}/{token}/:
    post:
      operationId: accounts_users_password_reset_confirm_create
      description: |-
        Validates the link parameters sent via email. If valid, updates the user's password to the newly provided one, invalidates all current sessions for this user, sends a confirmation email, and creates an audit log entry.

        Required permission: `AllowAny`.
      summary: Confirm password reset
      parameters:
      - in: path
        name: token
        schema:
          type: string
        description: The one-time password reset token generated for the user.
        required: true
      - in: path
        name: uidb64
        schema:
          type: string
        description: The Base64-encoded unique identifier of the user.
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: Password has been reset successfully.
        '400':
          description: Bad Request. Provided payload contains validation errors.
  /api/drones/:
    get:
      operationId: drones_list
      description: |-
        Retrieves a paginated and filtered list of all drones in the system.

        By default list displays only drones with active statuses. Choose one of the inactive statuses during filtration to get drones with inactive status.

        Required permission: `PERMISSION_DRONES_VIEW`.
      summary: List drones
      parameters:
      - in: query
        name: classification
        schema:
          type: string
          enum:
          - COMBAT
          - RECONNAISSANCE
          - SURVEILLANCE
          - TRANSPORT
      - in: query
        name: drone_model
        schema:
          type: integer
      - in: query
        name: drone_model__name
        schema:
          type: string
      - in: query
        name: inventory_number
        schema:
          type: string
      - in: query
        name: inventory_number__icontains
        schema:
          type: string
      - in: query
        name: is_firmware_outdated
        schema:
          type: boolean
      - in: query
        name: military_unit
        schema:
          type: string
      - in: query
        name: military_unit__name__icontains
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: serial_number
        schema:
          type: string
      - in: query
        name: serial_number__icontains
        schema:
          type: string
      - in: query
        name: spec__max_flight_time_min
        schema:
          type: number
      - in: query
        name: spec__max_flight_time_min__gte
        schema:
          type: number
      - in: query
        name: spec__max_flight_time_min__lte
        schema:
          type: number
      - in: query
        name: spec__max_range_km
        schema:
          type: number
      - in: query
        name: spec__max_range_km__gte
        schema:
          type: number
      - in: query
        name: spec__max_range_km__lte
        schema:
          type: number
      - in: query
        name: spec__max_speed_kmh
        schema:
          type: number
      - in: query
        name: spec__max_speed_kmh__gte
        schema:
          type: number
      - in: query
        name: spec__max_speed_kmh__lte
        schema:
          type: number
      - in: query
        name: spec__payload_capacity_g
        schema:
          type: integer
      - in: query
        name: spec__payload_capacity_g__gte
        schema:
          type: integer
      - in: query
        name: spec__payload_capacity_g__lte
        schema:
          type: integer
      - in: query
        name: spec__typical_flight_time_min
        schema:
          type: number
      - in: query
        name: spec__typical_flight_time_min__gte
        schema:
          type: number
      - in: query
        name: spec__typical_flight_time_min__lte
        schema:
          type: number
      - in: query
        name: spec__typical_range_km
        schema:
          type: number
      - in: query
        name: spec__typical_range_km__gte
        schema:
          type: number
      - in: query
        name: spec__typical_range_km__lte
        schema:
          type: number
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - DAMAGED
          - DECOMMISSIONED
          - IN_MISSION
          - LOST
          - MAINTENANCE
          - SOLD
          - TRANSFERRED
          - WRITTEN_OFF
      tags:
      - drones
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
