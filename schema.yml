    post:
      operationId: drones_write_offs_create
      description: "Creates a new immutable write-off record for a drone and records
        the resulting status transition in the drone status history.\n\nValidation:
        \n- A drone can be written off only once; a second write-off is rejected.
        \n- A drone that already has an inactive status cannot be written off. \n-
        When a related mission is supplied, it must be the drone's latest assigned
        mission, and the drone must be assigned to that mission.\n\nRequired permission:
        `PERMISSION_WRITEOFF_CREATE`."
      summary: Create a write-off record
      tags:
      - drones
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteOffRecordCreate'
            examples:
              ValidRequest:
                value:
                  drone: 29
                  reason: LOSS
                  reason_description: Lost during combat sortie behind enemy lines.
                  related_mission: 5
                  document_number: WO-2026-0009
                  written_off_at: '2026-07-10'
                summary: Valid Request
