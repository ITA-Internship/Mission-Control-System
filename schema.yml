        max_range_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        typical_flight_time_min:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
        max_flight_time_min:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        frequency_mhz:
          type: integer
          maximum: 2147483647
          minimum: 0
        payload_capacity_g:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        additional_modules: {}
        technical_documentation_url:
