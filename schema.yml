                  component_type: FRAME
                  component_name: null
                  old_serial_number: FRAME-SPEAR1-OLD
                  new_serial_number: FRAME-SPEAR1-NEW
                  reason: Frame section replaced after structural damage from forced
                    landing.
                  replaced_at: '2026-07-03'
                summary: Valid Request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ComponentReplacement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ComponentReplacement'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentReplacement'
              examples:
                ValidRequest:
                  value:
                    id: 5
                    drone: 25
                    component_type: FRAME
                    component_name: null
                    old_serial_number: FRAME-SPEAR1-OLD
                    new_serial_number: FRAME-SPEAR1-NEW
                    reason: Frame section replaced after structural damage from forced
                      landing.
                    replaced_at: '2026-07-03T00:00:00Z'
                    replaced_by: 24
                    created_at: '2026-07-03T05:09:09.903830Z'
                    updated_at: '2026-07-03T05:09:09.903879Z'
                  summary: Valid Request
          description: Component replacement report successfully created.
        '400':
          description: Bad Request. Provided payload contains validation errors.
        '403':
          description: Forbidden. User does not have permission to perform this action.
  /api/repairs/replacements/{id}/:
