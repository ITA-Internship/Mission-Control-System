          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        firmware_file_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        updated_at:
          type: string
          format: date-time
          readOnly: true
