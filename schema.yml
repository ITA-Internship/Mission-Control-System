components:
  schemas:
    AccountActivation:
      type: object
      description: Serialize account activation requests that set the initial password.
      properties:
        password:
          type: string
          writeOnly: true
      required:
      - password
    ActionEnum:
      enum:
      - view
      - download
      - upload
      - update
      - delete
      - denied
      type: string
    ActionTypeEnum:
      enum:
      - LOGIN_SUCCESS
      - LOGIN_FAILED
      - LOGOUT
      - USER_CREATED
      - ROLE_CHANGED
      - ACCOUNT_ACTIVATED
      - ACCOUNT_DEACTIVATED
      - PROFILE_UPDATED
      - PASSWORD_CHANGED
      - PASSWORD_RESET_REQUESTED
      - PERMISSION_DENIED
      type: string
    AuditLog:
      type: object
      description: Serialize audit log entries for read-only API responses.
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          type: integer
          nullable: true
          description: User performing the action (can be Null for system actions)
        actor_username:
          type: string
          readOnly: true
        target_user:
          type: integer
          nullable: true
          description: User on whom the action was taken
        target_user_username:
          type: string
          readOnly: true
        action_type:
          $ref: '#/components/schemas/ActionTypeEnum'
        result:
          $ref: '#/components/schemas/AuditLogResultEnum'
        description:
          type: string
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action_type
      - actor_username
      - created_at
      - id
      - result
      - target_user_username
    AuditLogResultEnum:
      enum:
      - SUCCESS
      - FAILED
      type: string
    BlankEnum:
      enum:
      - ''
    ChangePassword:
      type: object
      description: Serialize requests to change the user's password.
      properties:
        old_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
      required:
      - new_password
      - old_password
    ClassificationEnum:
      enum:
      - RECONNAISSANCE
      - COMBAT
      - TRANSPORT
      - SURVEILLANCE
      type: string
    ComponentReplacement:
      type: object
      description: |-
        Serialize standalone hardware replacements.

        Validates physical consistency (e.g., specific names for the OTHER category)
        and delegates creation to the service layer.
      properties:
        id:
          type: integer
          readOnly: true
        drone:
          type: integer
        component_type:
          $ref: '#/components/schemas/DefectType'
        component_name:
          type: string
          nullable: true
          maxLength: 255
        old_serial_number:
          type: string
          maxLength: 100
        new_serial_number:
          type: string
          maxLength: 100
        reason:
          type: string
        replaced_at:
          type: string
          format: date-time
        replaced_by:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - component_type
      - created_at
      - drone
      - id
      - new_serial_number
      - reason
      - replaced_at
      - replaced_by
      - updated_at
    ComponentReplacementList:
      type: object
      description: Read-only summary of a component replacement for list views.
      properties:
        id:
          type: integer
          readOnly: true
        drone:
          type: integer
          readOnly: true
        component_type:
          allOf:
          - $ref: '#/components/schemas/DefectType'
          readOnly: true
        component_name:
          type: string
          readOnly: true
          nullable: true
        new_serial_number:
          type: string
          readOnly: true
        replaced_at:
          type: string
          format: date-time
          readOnly: true
        replaced_by:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - component_name
      - component_type
      - created_at
      - drone
      - id
      - new_serial_number
      - replaced_at
      - replaced_by
    ConditionAfterEnum:
      enum:
      - ok
      - damaged
      - lost
      type: string
    DefectReport:
      type: object
      description: |-
        Serialize a defect report for creation and detailed view.

        The reporter field is strictly read-only because it must be securely
        bound to the authenticated user making the request via the service
        layer, rather than accepting it from the payload.
      properties:
        id:
          type: integer
          readOnly: true
        drone:
          type: integer
        defect_type:
          $ref: '#/components/schemas/DefectType'
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        description:
          type: string
        detected_at:
          type: string
          format: date-time
        reporter:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - defect_type
      - description
      - detected_at
      - drone
      - id
      - reporter
      - severity
      - updated_at
    DefectReportList:
      type: object
      description: Read-only summary of a defect report for list views.
      properties:
        id:
          type: integer
          readOnly: true
        drone:
          type: integer
          readOnly: true
        defect_type:
          allOf:
          - $ref: '#/components/schemas/DefectType'
          readOnly: true
        severity:
          allOf:
          - $ref: '#/components/schemas/SeverityEnum'
          readOnly: true
        detected_at:
          type: string
          format: date-time
          readOnly: true
        reporter:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - defect_type
      - detected_at
      - drone
      - id
      - reporter
      - severity
    DefectStatusUpdate:
      type: object
      description: Validate payloads for transitioning a DefectReport's status.
      properties:
        status:
          $ref: '#/components/schemas/ToStatusEnum'
        action_taken:
          type: string
      required:
      - action_taken
      - status
    DefectType:
      enum:
      - MOTOR
      - BATTERY
      - CAMERA
      - FRAME
      - PROPELLER
      - FLIGHT_CONTROLLER
      - VTX
      - WIRING
      - FIRMWARE
      - OTHER
      type: string
    Drone:
      type: object
      description: |-
        Serialize drone create/detail data with nested technical specification.

        Creation is delegated to the service layer so the drone, DroneSpec, and
        initial DroneSpecChangeLog are created consistently in one workflow.
      properties:
        id:
          type: integer
          readOnly: true
        serial_number:
          type: string
          maxLength: 100
        inventory_number:
          type: string
          maxLength: 100
        name:
          type: string
          maxLength: 100
        drone_model:
          type: integer
          description: Drone Model
        classification:
          $ref: '#/components/schemas/ClassificationEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/DroneStatus'
          readOnly: true
        military_unit:
          type: integer
        acquired_at:
          type: string
          format: date
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        spec:
          $ref: '#/components/schemas/DroneSpecDetail'
        writeoff_record:
          allOf:
          - $ref: '#/components/schemas/WriteOffRecord'
          readOnly: true
        status_label:
          type: string
          readOnly: true
        status_indicator:
          type: string
          readOnly: true
        status_category:
          type: string
          readOnly: true
      required:
      - acquired_at
      - classification
      - created_at
      - drone_model
      - id
      - inventory_number
      - military_unit
      - name
      - serial_number
      - spec
      - status
      - status_category
      - status_indicator
      - status_label
      - updated_at
      - writeoff_record
    DroneBrief:
      type: object
      description: |-
        Read-only summary of a drone, embedded in mission/assignment responses.

        Output-only: all fields are read-only, so it never creates or updates.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        serial_number:
          type: string
          readOnly: true
        drone_model:
          type: integer
          readOnly: true
          description: Drone Model
        status:
          allOf:
          - $ref: '#/components/schemas/DroneStatus'
          readOnly: true
      required:
      - drone_model
      - id
      - name
      - serial_number
      - status
    DroneImport:
      type: object
      description: Validate uploaded files for drone CSV import.
      properties:
        file:
          type: string
          format: uri
          description: CSV file with drone inventory data.
      required:
      - file
    DroneList:
      type: object
      description: Serialize compact drone fields for list responses.
      properties:
        id:
          type: integer
          readOnly: true
        serial_number:
          type: string
          maxLength: 100
        inventory_number:
          type: string
          maxLength: 100
        name:
          type: string
          maxLength: 100
        drone_model:
          type: integer
          description: Drone Model
        classification:
          $ref: '#/components/schemas/ClassificationEnum'
        status:
          $ref: '#/components/schemas/DroneStatus'
        status_label:
          type: string
          readOnly: true
        status_indicator:
          type: string
          readOnly: true
        status_category:
          type: string
          readOnly: true
        military_unit:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - classification
      - created_at
      - drone_model
      - id
      - inventory_number
      - military_unit
      - name
      - serial_number
      - status_category
      - status_indicator
      - status_label
    DroneModel:
      type: object
      description: Serialize drone model catalog entries and supported classifications.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        manufacturer:
          type: string
          maxLength: 255
        description:
          type: string
        supported_classifications:
          description: List of supported classifications
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - manufacturer
      - name
      - updated_at
    DroneSpecChangeLog:
      type: object
      description: Serialize specification audit entries for read-only API responses.
      properties:
        id:
          type: integer
          readOnly: true
        changed_by:
          type: integer
          readOnly: true
          nullable: true
        changed_fields:
          readOnly: true
        old_values:
          readOnly: true
        new_values:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - changed_by
      - changed_fields
      - created_at
      - id
      - new_values
      - old_values
    DroneSpecDetail:
      type: object
