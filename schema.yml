  /api/repairs/defects/{id}/update-status/:
    post:
      operationId: repairs_defects_update_status_create
      description: "Transitions a defect report to a new status and records a repair
        event documenting the change. On success, the reporter is notified by email
        for `IN_PROGRESS` and `FIXED` transitions.\n\nValidation: \n- An `action_taken`
        comment is required to explain the change. \n- The new status must differ
        from the current status. \n- A defect can be moved to `VERIFIED` only if its
        current status is `FIXED`. \n\nAdditional permissions: \n- Transitions to
        `IN_PROGRESS` or `FIXED` require `PERMISSION_REPAIRS_MANAGE` or `PERMISSION_REPAIRS_VERIFY`.
        \n- Transitions to `VERIFIED` require `PERMISSION_REPAIRS_VERIFY`.\n\nRequired
        permission: `PERMISSION_REPAIRS_CREATE`."
