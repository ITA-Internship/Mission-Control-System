          allOf:
          - $ref: '#/components/schemas/UserBrief'
          readOnly: true
        condition_after:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ConditionAfterEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        condition_description:
          type: string
          nullable: true
        flight_started_at:
          type: string
          format: date-time
          nullable: true
        flight_ended_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - drone
      - drone_details
      - id
      - mission
      - operator_details
