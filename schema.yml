    MissionDrone:
      type: object
      description: |-
        Serialize a mission-drone assignment with drone and operator details.

        Used to list assignments and to create new ones; ``create`` delegates to
        the service layer so locking and auditing stay consistent.
      properties:
        id:
          type: integer
          readOnly: true
        mission:
          type: integer
          readOnly: true
        drone:
          type: integer
